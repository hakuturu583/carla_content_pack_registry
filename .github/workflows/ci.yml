name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --features python -- -D warnings
      - run: cargo test

  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build the wheel and run the Python tests (end to end against moto's S3 with IAM auth)
        run: |
          python -m venv .venv && . .venv/bin/activate
          pip install "maturin>=1.9,<2" "pytest>=8" "moto[server]==5.2.5" boto3
          maturin build --release -o dist
          pip install dist/*.whl
          carla-pack --version
          pytest -v -p no:cacheprovider
      - name: Workflow templates are valid YAML
        run: |
          . .venv/bin/activate && pip install pyyaml
          python -c "import sys, yaml; [yaml.safe_load(open(f)) for f in sys.argv[1:]]" templates/pack-repo/.github/workflows/*.yml
