# Cloudflare Workers + D1 deployment.
# GitHub Environments "staging" and "production" hold the variables/secrets below;
# "production" must have required reviewers so `apply` and `deploy` wait for approval.
#   vars:    CF_ACCOUNT_ID, CF_ZONE_NAME, AWS_DEPLOY_ROLE_ARN, AWS_REGION, GITHUB_OAUTH_CLIENT_ID
#   secrets: CLOUDFLARE_API_TOKEN, SMOKE_GITHUB_TOKEN (optional, read-only test user)
# Worker secrets (GITHUB_CLIENT_SECRET, CREDENTIAL_KEYS, ...) are set once with
# `wrangler secret put` per docs/runbook.md and are not handled by this workflow.
name: Deploy (Cloudflare)

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read
  id-token: write # OIDC to AWS for the Terraform state backend

concurrency:
  group: deploy-cloudflare-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}-plan
    defaults:
      run:
        working-directory: infra/cloudflare
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: terraform init -input=false -backend-config=envs/${{ inputs.environment }}.backend.hcl
      - run: terraform plan -input=false -var-file=envs/${{ inputs.environment }}.tfvars -out=tfplan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: cf-tfplan-${{ inputs.environment }}
          path: infra/cloudflare/tfplan
          retention-days: 3

  release:
    # Single job in the protected environment, so one approval covers
    # terraform apply -> D1 migrations -> Worker deploy -> smoke test.
    needs: plan
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: actions/download-artifact@v5
        with:
          name: cf-tfplan-${{ inputs.environment }}
          path: infra/cloudflare
      - name: Terraform apply (approved plan)
        working-directory: infra/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          terraform init -input=false -backend-config=envs/${{ inputs.environment }}.backend.hcl
          terraform apply -input=false tfplan
          {
            echo "D1_DATABASE_ID=$(terraform output -raw d1_database_id)"
            echo "D1_DATABASE_NAME=$(terraform output -raw d1_database_name)"
            echo "HOSTNAME=$(terraform output -raw public_base_url | sed 's#https://##')"
            echo "REGISTRY_AWS_PRINCIPAL_ARN=$(terraform output -raw registry_aws_principal_arn 2>/dev/null || true)"
          } >> "$GITHUB_ENV"
      - name: Render wrangler config
        env:
          ENV: ${{ inputs.environment }}
          ZONE_NAME: ${{ vars.CF_ZONE_NAME }}
          GITHUB_CLIENT_ID: ${{ vars.GITHUB_OAUTH_CLIENT_ID }}
        run: node scripts/render-wrangler.mjs
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx wrangler d1 migrations apply "$D1_DATABASE_NAME" --remote --config deploy/cloudflare/wrangler.${{ inputs.environment }}.generated.toml
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx wrangler deploy --config deploy/cloudflare/wrangler.${{ inputs.environment }}.generated.toml
      - name: Smoke test
        env:
          SMOKE_TOKEN: ${{ secrets.SMOKE_GITHUB_TOKEN }}
        run: SMOKE_BASE_URL="https://$HOSTNAME" npm run smoke
