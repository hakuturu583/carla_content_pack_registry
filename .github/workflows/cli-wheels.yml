# Builds carla-pack wheels (abi3, Python >= 3.10) for Linux/macOS/Windows and an sdist.
# Artifacts only: publishing to PyPI needs a trusted-publisher setup and an explicit decision.
name: carla-pack wheels

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64, manylinux: "2_28" }
          - { os: ubuntu-24.04, target: aarch64, manylinux: "2_28" }
          - { os: macos-14, target: aarch64 }
          - { os: macos-14, target: x86_64 }
          - { os: windows-2022, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: cli
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: cli/dist/*.whl

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: cli
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: cli/dist/*.tar.gz
