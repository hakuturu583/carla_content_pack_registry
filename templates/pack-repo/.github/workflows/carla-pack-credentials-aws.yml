# Publishes short-lived, read-only AWS S3 credentials for the bucket in carla-packs.toml
# as the release asset carla-pack-credentials/credentials.json. Everyone who can read
# this (private) repository can download them: that is the access check. No AWS key is
# stored anywhere: the workflow assumes a role through GitHub's OIDC provider, and the
# session is further limited to s3:GetObject below the prefix. Credentials live 12 hours
# and are replaced every 6.
#
# Setup:
#   1. An IAM role whose trust policy allows token.actions.githubusercontent.com for
#      repo:<OWNER>/<THIS REPO>:ref:refs/heads/<default branch> (sts:AssumeRoleWithWebIdentity),
#      with "Maximum session duration" 12 hours and s3:GetObject on the bucket.
#   2. Actions variables: AWS_ROLE_ARN, AWS_REGION, S3_BUCKET, S3_PREFIX (as in carla-packs.toml).
name: carla-pack credentials (AWS)

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write # to replace the release asset
  id-token: write # to assume the role through OIDC

concurrency:
  group: carla-pack-credentials
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: carla-pack-credentials
    steps:
      - name: Refuse to publish credentials from a public repository
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" != "true" ]; then
            echo "::error::$GITHUB_REPOSITORY is public: everyone could read its credentials. Make it private, or use credentials = \"anonymous\" with a public bucket."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: carla-pack-credentials
          role-duration-seconds: 43200
          inline-session-policy: >-
            ${{ format('{{"Version":"2012-10-17","Statement":[{{"Effect":"Allow","Action":"s3:GetObject","Resource":"arn:aws:s3:::{0}/{1}*"}}]}}', vars.S3_BUCKET, vars.S3_PREFIX) }}

      - name: Write credentials.json
        run: |
          set -euo pipefail
          umask 077
          aws configure export-credentials --format process |
            jq '{version: 1, access_key_id: .AccessKeyId, secret_access_key: .SecretAccessKey,
                 session_token: .SessionToken, expires_at: .Expiration}' > "$RUNNER_TEMP/credentials.json"

      - name: Publish them as the release asset
        run: |
          set -euo pipefail
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --prerelease --title "carla-pack storage credentials" \
              --notes "Read-only storage credentials for carla-pack, replaced every 6 hours by .github/workflows/carla-pack-credentials-aws.yml. Do not edit."
          gh release upload "$TAG" "$RUNNER_TEMP/credentials.json" --clobber -R "$GITHUB_REPOSITORY"
          rm -f "$RUNNER_TEMP/credentials.json"
