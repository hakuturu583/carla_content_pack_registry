# Publishes short-lived, read-only Cloudflare R2 credentials for the bucket in
# carla-packs.toml as the release asset carla-pack-credentials/credentials.json.
# Everyone who can read this (private) repository can download them: that is the
# access check. Credentials live 12 hours and are replaced every 6.
#
# Setup (Settings > Secrets and variables > Actions):
#   secret   CLOUDFLARE_API_TOKEN     Cloudflare API token allowed to create R2 temporary credentials
#   variable R2_ACCOUNT_ID            Cloudflare account ID
#   variable R2_BUCKET                bucket name (as in carla-packs.toml)
#   variable R2_PREFIX                prefix (as in carla-packs.toml, e.g. packs/); empty for the whole bucket
#   variable R2_PARENT_ACCESS_KEY_ID  access key ID of an R2 API token with read access to the bucket;
#                                     the temporary credentials are derived from it and can never exceed it
name: carla-pack credentials (R2)

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write # to replace the release asset

concurrency:
  group: carla-pack-credentials
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: carla-pack-credentials
      TTL_SECONDS: "43200"
    steps:
      - name: Refuse to publish credentials from a public repository
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" != "true" ]; then
            echo "::error::$GITHUB_REPOSITORY is public: everyone could read its credentials. Make it private, or use credentials = \"anonymous\" with a public bucket."
            exit 1
          fi

      - name: Mint read-only R2 credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          BUCKET: ${{ vars.R2_BUCKET }}
          PREFIX: ${{ vars.R2_PREFIX }}
          PARENT_ACCESS_KEY_ID: ${{ vars.R2_PARENT_ACCESS_KEY_ID }}
        run: |
          set -euo pipefail
          body=$(jq -n --arg bucket "$BUCKET" --arg parent "$PARENT_ACCESS_KEY_ID" --arg prefix "$PREFIX" \
            --argjson ttl "$TTL_SECONDS" \
            '{bucket: $bucket, parentAccessKeyId: $parent, permission: "object-read-only", ttlSeconds: $ttl}
             + (if $prefix == "" then {} else {prefixes: [$prefix]} end)')
          res=$(curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/r2/temp-access-credentials" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data "$body")
          echo "::add-mask::$(jq -r .result.secretAccessKey <<<"$res")"
          echo "::add-mask::$(jq -r .result.sessionToken <<<"$res")"
          expires=$(date -u -d "+$TTL_SECONDS seconds" +%Y-%m-%dT%H:%M:%SZ)
          umask 077
          jq --arg expires "$expires" '{version: 1, access_key_id: .result.accessKeyId,
              secret_access_key: .result.secretAccessKey, session_token: .result.sessionToken,
              expires_at: $expires}' <<<"$res" > "$RUNNER_TEMP/credentials.json"

      - name: Publish them as the release asset
        run: |
          set -euo pipefail
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --prerelease --title "carla-pack storage credentials" \
              --notes "Read-only storage credentials for carla-pack, replaced every 6 hours by .github/workflows/carla-pack-credentials-r2.yml. Do not edit."
          gh release upload "$TAG" "$RUNNER_TEMP/credentials.json" --clobber -R "$GITHUB_REPOSITORY"
          rm -f "$RUNNER_TEMP/credentials.json"
