[package]
name = "carla-pack"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Core of the carla-pack CLI: CARLA Content Pack Registry client"
license = "Apache-2.0"
publish = false

[lib]
name = "carla_pack_registry"
# cdylib: the Python extension module (carla_pack_registry._core); rlib: Rust tests.
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Enabled by maturin when building the Python package (see pyproject.toml).
python = ["dep:pyo3"]

[dependencies]
dirs = "7.0.0"
flate2 = "1.1.10"
percent-encoding = "2.3.2"
pyo3 = { version = "0.30.1", features = ["abi3-py310"], optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "form", "query", "rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
tar = { version = "0.4.46", default-features = false }
thiserror = "2.0.21"

[dev-dependencies]
httpmock = "0.8.3"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
